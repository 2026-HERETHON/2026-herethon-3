<!DOCTYPE html>
<html>
<head><title>{{ grid.dong }} Q&A</title></head>
<body data-grid-id="{{ grid.id }}">
  <h2>{{ grid.dong }} Q&A</h2>

  <!-- Q&A 카드: 사이드바에 실제로 보이는 마크업을 서버가 그대로 렌더링.
       프론트 JS는 값만 재조립하지 않고 #rightSB-qnaCardContainer의
       innerHTML을 통째로 옮겨 붙이기만 함 -->
  <div id="rightSB-qnaCardContainer" data-count="{{ questions.count }}">
    {% if is_empty %}
      <div style="text-align:center; color:#7b7578; padding:24px 0;">등록된 질문이 없습니다. 첫 질문을 던져보세요!</div>
    {% else %}
      {% for question in questions %}
        <div class="rightSB-qnaCard" data-id="{{ question.id }}">
          <div class="rightSB-qnaLeft">
            <div class="rightSB-qnaAvatar">Q</div>
            <span class="rightSB-qnaQuestion">{{ question.question_content }}</span>
          </div>
          <div class="rightSB-qnaRight">
            <span class="rightSB-qnaAnswerText">답변 {{ question.answers.count }}</span>
          </div>
        </div>
      {% endfor %}
    {% endif %}
  </div>

  {% if request.user.is_authenticated %}
    <a href="{% url 'qna:create' grid.id %}">질문 등록하기</a>
  {% else %}
    <a href="{% url 'accounts:login' %}?next={% url 'qna:create' grid.id %}">로그인하고 질문 등록하기</a>
  {% endif %}
</body>
</html>
