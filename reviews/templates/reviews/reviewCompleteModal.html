{% if messages %}
  {% for message in messages %}
    {% if message.message == 'review_created' %}
      <div class="modal-overlay" id="postCompleteModal">
        <div class="modal-card">
          <button class="modal-close" aria-label="닫기" type="button">&times;</button>
          <div class="modal-icon">
            <svg viewBox="0 0 24 24" width="44" height="44" fill="none"
                 stroke="#378ADD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 21s-7-4.35-7-10a7 7 0 0 1 14 0c0 5.65-7 10-7 10z"/>
              <circle cx="12" cy="11" r="2.5"/>
            </svg>
          </div>
          <h2 class="modal-title">후기 작성이 <span>완료</span>되었습니다!</h2>
          <p class="modal-desc">소중한 후기가 다른 사용자에게<br>큰 도움이 됩니다.</p>
          <button class="modal-btn-primary" type="button">확인</button>
        </div>
      </div>
    {% endif %}
  {% endfor %}
{% endif %}
