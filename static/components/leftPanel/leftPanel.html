<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Left Panel</title>
    <link rel="stylesheet" href="leftPanel.css" />
  </head>
  <body>
    <div class="leftPanel-wrapper">

      <div class="leftPanel-searchWrapper">
        <div class="leftPanel-searchBar">
          <img src="./leftPanel-images/search.svg" class="leftPanel-searchIcon" />
          <input type="text" placeholder="장소를 입력해주세요" class="leftPanel-searchInput" />
        </div>
        <ul class="leftPanel-searchResults leftPanel-hide"></ul>
      </div>
      <!-- 안전 정보 필터 -->
      <div class="leftPanel-filterBox">
        <div class="leftPanel-filterHeader">
          <h4>안전 정보 필터</h4>
          <span class="leftPanel-resetBtn">초기화</span>
        </div>

        <div class="leftPanel-filterItem">
          <div class="leftPanel-filterItemLeft">
            <img src="./leftPanel-images/cctv.png" alt="CCTV" />
            <span>CCTV</span>
          </div>
          <label class="leftPanel-customCheckbox">
            <input type="checkbox" id="leftPanel-filter-cctv" />
            <span class="leftPanel-checkboxBox"></span>
            <img
              src="./leftPanel-images/check.svg"
              class="leftPanel-checkboxIcon"
              alt="체크됨"
            />
          </label>
        </div>

        <div class="leftPanel-filterItem">
          <div class="leftPanel-filterItemLeft">
            <img src="./leftPanel-images/streetlight.png" alt="가로등" />
            <span>가로등</span>
          </div>
          <label class="leftPanel-customCheckbox">
            <input type="checkbox" />
            <span class="leftPanel-checkboxBox"></span>
            <img
              src="./leftPanel-images/check.svg"
              class="leftPanel-checkboxIcon"
              alt="체크됨"
            />
          </label>
        </div>

        <div class="leftPanel-filterItem">
          <div class="leftPanel-filterItemLeft">
            <img src="./leftPanel-images/police.png" alt="파출소/지구대" />
            <span>파출소 / 지구대</span>
          </div>
          <label class="leftPanel-customCheckbox">
            <input type="checkbox" />
            <span class="leftPanel-checkboxBox"></span>
            <img
              src="./leftPanel-images/check.svg"
              class="leftPanel-checkboxIcon"
              alt="체크됨"
            />
          </label>
        </div>

        <div class="leftPanel-filterItem">
          <div class="leftPanel-filterItemLeft">
            <img src="./leftPanel-images/alarm.png" alt="비상벨" />
            <span>비상벨</span>
          </div>
          <label class="leftPanel-customCheckbox">
            <input type="checkbox" />
            <span class="leftPanel-checkboxBox"></span>
            <img
              src="./leftPanel-images/check.svg"
              class="leftPanel-checkboxIcon"
              alt="체크됨"
            />
          </label>
        </div>

        <div class="leftPanel-filterItem">
          <div class="leftPanel-filterItemLeft">
            <img src="./leftPanel-images/night.svg" alt="여성밤길치안안전" />
            <span>여성밤길치안안전</span>
          </div>
          <label class="leftPanel-customCheckbox">
            <input type="checkbox" />
            <span class="leftPanel-checkboxBox"></span>
            <img src="./leftPanel-images/check.svg" class="leftPanel-checkboxIcon" alt="체크됨" />
          </label>
        </div>

        <div class="leftPanel-filterItem">
          <div class="leftPanel-filterItemLeft">
            <img src="./leftPanel-images/warning.png" alt="범죄주의구간" />
            <span>범죄주의구간</span>
          </div>
          <label class="leftPanel-customCheckbox">
            <input type="checkbox" />
            <span class="leftPanel-checkboxBox"></span>
            <img
              src="./leftPanel-images/check.svg"
              class="leftPanel-checkboxIcon"
              alt="체크됨"
            />
          </label>
        </div>
      </div>

      <!-- 안전 점수 범례 -->
      <div class="leftPanel-legendBox">
        <h4>안전 점수 범례</h4>
        <div class="leftPanel-legendGradient">
          <span class="leftPanel-legendCell" style="background: #1077ff"></span>
          <span class="leftPanel-legendCell" style="background: #1d9bfe"></span>
          <span class="leftPanel-legendCell" style="background: #48b7ff"></span>
          <span class="leftPanel-legendCell" style="background: #6dc6ff"></span>
          <span class="leftPanel-legendCell" style="background: #99CDE5"></span>
          <span class="leftPanel-legendCell" style="background: #B9D4DF"></span>
          <span class="leftPanel-legendCell" style="background: #DADFE1"></span>
        </div>
        <div class="leftPanel-legendLabels">
          <span>매우 안전</span>
          <span>주의 필요</span>
        </div>
      </div>

      <!-- 사용 가이드 -->
      <div class="leftPanel-guideBox">
        <div class="leftPanel-guideHeader">
          <h4>사용 가이드</h4>
          <span class="leftPanel-closeIcon">✕</span>
        </div>
        <p>지도를 클릭하거나 드래그하여 원하는 지역을 탐색해보세요.</p>
      </div>

      <!-- 안내 -->
      <div class="leftPanel-noticeBox">
        <h4>안내</h4>
        <p>
          본 정보는 공공데이터와 사용자 후기를 기반으로 한 참고 자료이며, 특정
          지역을 위험 지역으로 단정하지 않습니다.
        </p>
      </div>
    </div>

    <script src="./leftPanel.js"></script>
  </body>
</html>
