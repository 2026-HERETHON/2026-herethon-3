<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>제휴 서비스</title>
  <link rel="stylesheet" href="../main.css" />
  <link rel="stylesheet" href="./commercial.css" />
</head>
<body>

  <nav>
  <div id="navbar-container">
    <div class="navbar-logoImg">로고</div>
    <div class="navbar-Select">
      <div class="navbar-menu navbar-safetyMap" data-target="page-safetyMap">
        안심맵
      </div>
      <div class="navbar-menu navbar-commercial beBold" data-target="page-commercial">
        제휴 서비스
      </div>
      <div class="navbar-underline"></div>
    </div>
    <a href="javascript:void(0);" class="navbar-ahref" id="main-nav-login-btn">
      <div class="navbar-login">
        <img class="navbar-loginImg" src="../main-images/goToLogin.svg" alt="로그인하기" />
        로그인
      </div>
    </a>
  </div>
</nav>

  <!-- 메인 레이아웃 영역 (네비바 제외함) -->
  <div class="commercial-container">
    
    <!-- 1. 왼쪽 사이드바 -->
    <aside class="sidebar">
      <ul class="sidebar-menu">
        <!-- active 클래스로 현재 선택된 메뉴 하이라이트 표시함 -->
        <li class="menu-item active">
          <img src="commercial-image/commercial_icon.svg" alt="" class="menu-icon">
          <span>제휴 서비스</span>
        </li>
        <li class="menu-item">
          <img src="commercial-image/icon-inquiry.svg" alt="" class="menu-icon">
          <span>제휴 문의</span>
        </li>
      </ul>
    </aside>

    <!-- 2. 오른쪽 메인 콘텐츠 -->
    <main class="content-area">
      
      <!-- 상단 헤더 섹션 (타이틀 & 일러스트) -->
      <!-- 상단 헤더 섹션 (여백 조정용 구조 설계함) -->
      <section class="content-header">
        <div class="header-text">
          <span class="sub-title">안전한 일상을 위한 파트너</span>
          <h1 class="main-title">제휴 서비스<span class="point-blue">.</span></h1>
          <p class="description">
          신뢰할 수 있는 파트너와 함께<br>
          더 안전하고 편리한 생활을 지원합니다.
          </p>
        </div>
      <div class="header-image">
        <img src="commercial-image/partner-illustration.png" alt="제휴 서비스 일러스트">
      </div>
      </section>

      <!-- 하단 서비스 카드 리스트 섹션 -->
      <!-- 하단 서비스 카드 리스트 섹션 -->
<section class="card-list">
  
  <!-- 카드 1: 안심 귀가 서비스 (theme-return 클래스 추가함) -->
  <div class="service-card theme-return">
    <div class="card-left">
      <!-- 기존 코드 동일함 -->
      <div class="icon-wrapper circle-blue">
        <img src="commercial-image/icon-shield.svg" alt="방패 아이콘">
      </div>
      <div class="card-info">
        <h3>안심 귀가 서비스</h3>
        <p>늦은 밤에도 안심하고 귀가할 수 있도록<br>동행 매칭과 경로 공유를 지원합니다.</p>
      </div>
    </div>
    <div class="card-divider-up"></div>
    <div class="card-right">
      <ul class="feature-list">
        <li><img src="commercial-image/icon-li1.svg" alt=""> 실시간 동행 매칭</li>
        <li><img src="commercial-image/icon-li2.svg" alt=""> 실시간 위치 공유</li>
        <li><img src="commercial-image/icon-li3.svg" alt=""> 위급상황 자동 알림</li>
      </ul>
      <button class="btn-detail">자세히 보기</button>
    </div>
  </div>

  <!-- 카드 2: 안심 주거 서비스 (theme-housing 클래스 추가하고 btn-detail 뒤의 blue-bg 클래스는 제거함) -->
  <div class="service-card theme-housing">
    <div class="card-left">
      <!-- 기존 코드 동일함 -->
      <div class="icon-wrapper circle-light-blue">
        <img src="commercial-image/icon-home.svg" alt="집 아이콘">
      </div>
      <div class="card-info">
        <h3>안심 주거 서비스</h3>
        <p>전월세 계약부터 이사, 정착까지<br>안전한 주거 생활을 도와드립니다.</p>
      </div>
    </div>
    <div class="card-divider-down"></div>
    <div class="card-right">
      <ul class="feature-list">
        <li><img src="commercial-image/icon-li1.svg" alt=""> 전월세 계약 체크리스트</li>
        <li><img src="commercial-image/icon-li4.svg" alt=""> 이사 업체 추천</li>
        <li><img src="commercial-image/icon-li5.svg" alt=""> 주거 정보 및 가이드</li>
      </ul>
      <!-- 버튼 클래스명을 통일해서 CSS 제어를 쉽게 만듦 -->
      <button class="btn-detail">자세히 보기</button> 
    </div>
  </div>


      </section>
    </main>
  </div>

  <script src="commercial.js"></script>
</body>
</html>
